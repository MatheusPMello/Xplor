<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="TravelEase - Discover the world's most breathtaking destinations with our curated selection of travel experiences.">
    <title>TravelEase - Explore Your Dream Destinations</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav id="main-nav">
            <div class="nav-left">
                <a href="home.html" class="logo">
                    <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                    <span class="logo-text">TravelEase</span>
                </a>
                <div class="nav-links">
                    <a href="home.html">Home</a>
                    <a href="about.html">About us</a>
                    <a href="contact.html">Contact us</a>
                </div>
            </div>
            <form class="search-form" id="search-form">
                <input type="text" id="destination-search" placeholder="Enter a destination or keyword">
                <div class="search-buttons">
                    <button type="submit" id="btn-search">Search</button>
                    <button type="button" id="btn-clear">Clear</button>
                </div>
            </form>
        </nav>
    </header>

    <main>
        <div id="results-container" class="results-container"></div>
        <section class="hero-section">
            <div class="about-section">
                <div class="about-header">
                    <h1>Explore Your Dream Destinations</h1>
                    <p>
                        Discover the world's most breathtaking destinations with our curated selection of travel
                        experiences. From pristine beaches to majestic mountains, we have something for every
                        adventurer.
                    </p>
                </div>
                <button type="button" id="btn-book-now" class="btn-primary">Book Now</button>
            </div>
        </section>
    </main>

    <script src="travel_recommendation.js"></script>
</body>

</html>
