<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch with TravelEase. We're here to help you plan your next great adventure.">
    <title>Contact Us - TravelEase</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav id="main-nav">
            <div class="nav-left">
                <a href="index.html" class="logo">
                    <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"></line>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                    </svg>
                    <span class="logo-text">TravelEase</span>
                </a>
                <div class="nav-links">
                    <a href="index.html">Home</a>
                    <a href="about.html">About us</a>
                    <a href="contact.html">Contact us</a>
                </div>
            </div>
            <form class="search-form" id="search-form">
                <input type="text" id="destination-search" placeholder="Enter a destination or keyword">
                <div class="search-buttons">
                    <button type="submit" id="btn-search">Search</button>
                    <button type="button" id="btn-clear">Clear</button>
                </div>
            </form>
        </nav>
    </header>

    <main>
        <section class="hero-section">
            <div class="about-section">
                <div class="about-header">
                    <h1>Contact Us</h1>
                    <p>
                        Get in touch with us for any inquiries or assistance.
                    </p>
                    <div class="contact-form-container">
                        <form class="contact-form" id="contact-form" action="contact.html">
                            <div class="form-group">
                                <label for="name">Name</label>
                                <input type="text" id="name" name="name" placeholder="Enter your name" required>
                            </div>
                            <div class="form-group">
                                <label for="email">Email</label>
                                <input type="email" id="email" name="email" placeholder="Enter your email" required>
                            </div>
                            <div class="form-group">
                                <label for="message">Message</label>
                                <textarea id="message" name="message" placeholder="Enter your message" rows="4" required></textarea>
                            </div>
                            <button type="submit" class="btn-primary">Send Message</button>
                        </form>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="travel_recommendation.js"></script>
</body>

</html>
